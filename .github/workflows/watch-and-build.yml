name: Watch OpenRGB → Trigger OBS Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.last_commit' # Prevents the bot's own commit from triggering an infinite loop
  schedule:
    - cron: '0 */4 * * *' # Runs at minute 0 past every 4th hour

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force OBS rebuild even if no new commits'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  OBS_PROJECT: home:itachi-re
  OBS_PACKAGE: openrgb

# Prevents multiple runs of this workflow from executing simultaneously
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Failsafe to prevent stuck jobs from draining minutes

    steps:
      - name: Checkout watcher repo
        uses: actions/checkout@v4 # Downgraded from v5 to v4 (latest stable)

      - name: Fetch latest upstream commit SHA
        id: upstream
        run: |
          LATEST=$(git ls-remote \
            https://gitlab.com/CalcProgrammer1/OpenRGB.git \
            refs/heads/master | awk '{print $1}')

          if [ -z "$LATEST" ]; then
            echo "❌ Could not fetch upstream SHA — aborting."
            exit 1
          fi

          echo "✅ Latest upstream SHA: $LATEST"
          echo "sha=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare with last built commit
        id: compare
        run: |
          LATEST="${{ steps.upstream.outputs.sha }}"
          
          # Safely check if file exists to prevent errors on first run
          KNOWN=""
          if [ -f .last_commit ]; then
            KNOWN=$(cat .last_commit | tr -d '[:space:]')
          fi
          
          FORCE="${{ github.event.inputs.force_rebuild }}"

          echo "Latest  : $LATEST"
          echo "Known   : ${KNOWN:-<none yet>}"
          echo "Force   : ${FORCE:-false}"

          if [ "$FORCE" = "true" ]; then
            echo "⚡ Force rebuild requested — skipping SHA comparison."
            echo "changed=true" >> "$GITHUB_OUTPUT"

          elif [ "$LATEST" = "$KNOWN" ]; then
            echo "✅ No new commits. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else
            echo "🆕 New commit detected!"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger OBS build
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "🚀 Triggering OBS source service run..."
          echo "   Project : $OBS_PROJECT"
          echo "   Package : $OBS_PACKAGE"

          # Using jq for much cleaner inline URL encoding
          PROJECT_ENC=$(jq -rn --arg x "$OBS_PROJECT" '$x|@uri')
          PACKAGE_ENC=$(jq -rn --arg x "$OBS_PACKAGE" '$x|@uri')

          HTTP=$(curl -s \
            -o /tmp/resp.txt \
            -w "%{http_code}" \
            -H "Authorization: Token ${{ secrets.OBS_TOKEN }}" \
            -X POST \
            "https://build.opensuse.org/trigger/runservice?project=${PROJECT_ENC}&package=${PACKAGE_ENC}")

          echo "HTTP: $HTTP"
          echo "Response:"
          cat /tmp/resp.txt

          if [ "$HTTP" != "200" ]; then
            echo "❌ OBS trigger failed (HTTP $HTTP)"
            exit 1
          fi

          echo "✅ OBS build triggered successfully."

      - name: Update .last_commit
        if: steps.compare.outputs.changed == 'true'
        run: |
          LATEST="${{ steps.upstream.outputs.sha }}"
          SHORT="${LATEST:0:8}"

          echo "$LATEST" > .last_commit

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .last_commit

          # Cleaner bash syntax for the commit/push
          if ! git diff --cached --quiet; then
            git commit -m "chore: built upstream commit ${SHORT}"
            git push
            echo "✅ .last_commit updated to ${LATEST}"
          else
            echo "⚠️ No changes detected for .last_commit"
          fi
