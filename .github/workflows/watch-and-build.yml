      - name: Wait for OBS build to complete
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "Waiting 30 seconds for OBS scheduler..."
          sleep 30

          echo "⏳ Polling OBS — max 60 min..."

          for i in $(seq 1 60); do
            HTTP=$(curl -s \
              -o /tmp/obs_status.xml \
              -w "%{http_code}" \
              "https://build.opensuse.org/build/${OBS_PROJECT}/${OBS_REPO}/${OBS_ARCH}/${OBS_PACKAGE}/_status")

            echo "[$(date -u +%H:%M:%S)] HTTP=$HTTP (attempt $i/60)"

            if [ "$HTTP" != "200" ]; then
              echo "⚠️ OBS returned HTTP $HTTP"
              sleep 60
              continue
            fi

            if [ ! -s /tmp/obs_status.xml ]; then
              echo "⚠️ Empty OBS response"
              sleep 60
              continue
            fi

            STATUS=$(python3 -c "
import xml.etree.ElementTree as ET
try:
    root = ET.parse('/tmp/obs_status.xml').getroot()
    print(root.get('code', 'unknown'))
except Exception:
    print('invalid')
")

            echo "Status=$STATUS"

            case \"$STATUS\" in
              succeeded)
                echo '✅ Build succeeded!'
                exit 0
                ;;

              failed|unresolvable|broken)
                echo \"❌ Build failed — status: $STATUS\"
                cat /tmp/obs_status.xml
                exit 1
                ;;

              scheduled|building|blocked|dispatching|signing|finished)
                ;;

              invalid)
                echo '⚠️ Invalid XML'
                cat /tmp/obs_status.xml
                ;;

              *)
                echo \"⚠️ Unknown status: $STATUS\"
                cat /tmp/obs_status.xml
                ;;
            esac

            sleep 60
          done

          echo '❌ Timed out after 60 minutes'
          exit 1
