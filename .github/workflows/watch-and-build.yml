name: Watch OpenRGB → Trigger OBS Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '.last_commit' # Prevents the bot's own commit from triggering an infinite loop
  schedule:
    - cron: '0 */4 * * *' # Runs at minute 0 past every 4th hour

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force OBS rebuild even if no new commits'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  OBS_PROJECT: home:itachi_re
  OBS_PACKAGE: openrgb
  UPSTREAM_GITLAB: https://gitlab.com/CalcProgrammer1/OpenRGB.git
  UPSTREAM_GITHUB: https://github.com/CalcProgrammer1/OpenRGB.git

# Prevents multiple runs of this workflow from executing simultaneously
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  watch-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Failsafe to prevent stuck jobs from draining minutes

    steps:
      - name: Checkout watcher repo
        uses: actions/checkout@v7

      - name: Fetch latest upstream commit SHA (with retry + GitHub fallback)
        id: upstream
        run: |
          fetch_sha () {
            local url="$1"
            git ls-remote "$url" refs/heads/master 2>/dev/null | awk '{print $1}'
          }

          LATEST=""

          # Try GitLab first, up to 5 attempts with backoff
          for i in 1 2 3 4 5; do
            LATEST=$(fetch_sha "$UPSTREAM_GITLAB")
            if [ -n "$LATEST" ]; then
              echo "✅ Got SHA from GitLab on attempt $i: $LATEST"
              break
            fi
            echo "⚠️ GitLab attempt $i failed (transient error, e.g. 503). Retrying in $((i*5))s..."
            sleep $((i * 5))
          done

          # Fallback to the GitHub mirror if GitLab never responded
          if [ -z "$LATEST" ]; then
            echo "⚠️ GitLab unreachable after 5 attempts — falling back to GitHub mirror."
            LATEST=$(fetch_sha "$UPSTREAM_GITHUB")
          fi

          if [ -z "$LATEST" ]; then
            echo "❌ Could not fetch upstream SHA from GitLab or GitHub mirror — aborting."
            exit 1
          fi

          echo "✅ Latest upstream SHA: $LATEST"
          echo "sha=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Compare with last built commit
        id: compare
        run: |
          LATEST="${{ steps.upstream.outputs.sha }}"

          # Safely check if file exists to prevent errors on first run
          KNOWN=""
          if [ -f .last_commit ]; then
            KNOWN=$(cat .last_commit | tr -d '[:space:]')
          fi

          FORCE="${{ github.event.inputs.force_rebuild }}"

          echo "Latest  : $LATEST"
          echo "Known   : ${KNOWN:-<none yet>}"
          echo "Force   : ${FORCE:-false}"

          if [ "$FORCE" = "true" ]; then
            echo "⚡ Force rebuild requested — skipping SHA comparison."
            echo "changed=true" >> "$GITHUB_OUTPUT"

          elif [ "$LATEST" = "$KNOWN" ]; then
            echo "✅ No new commits. Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"

          else
            echo "🆕 New commit detected!"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger OBS build
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "🚀 Triggering OBS source service run..."
          echo "   Project : $OBS_PROJECT"
          echo "   Package : $OBS_PACKAGE"

          PROJECT_ENC=$(jq -rn --arg x "$OBS_PROJECT" '$x|@uri')
          PACKAGE_ENC=$(jq -rn --arg x "$OBS_PACKAGE" '$x|@uri')

          HTTP=$(curl -s \
            -o /tmp/resp.txt \
            -w "%{http_code}" \
            -H "Authorization: Token ${{ secrets.OBS_TOKEN }}" \
            -X POST \
            "https://api.opensuse.org/trigger/runservice?project=${PROJECT_ENC}&package=${PACKAGE_ENC}")

          echo "HTTP: $HTTP"
          echo "Response:"
          cat /tmp/resp.txt

          if [ "$HTTP" != "200" ]; then
            echo "❌ OBS trigger failed (HTTP $HTTP)"
            exit 1
          fi

          echo "✅ OBS build triggered successfully."

      - name: Update .last_commit
        if: steps.compare.outputs.changed == 'true'
        run: |
          LATEST="${{ steps.upstream.outputs.sha }}"
          SHORT="${LATEST:0:8}"

          echo "$LATEST" > .last_commit

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .last_commit

          if ! git diff --cached --quiet; then
            git commit -m "chore: built upstream commit ${SHORT}"
            git push
            echo "✅ .last_commit updated to ${LATEST}"
          else
            echo "⚠️ No changes detected for .last_commit"
          fi
